<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoMax - تسجيل دخول الأدمن</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="login-card shadow-lg">
    <h3 class="text-center text-warning fw-bold mb-4">LingoMax Admin</h3>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2 text-center fs-6">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label text-light">كلمة المرور</label>
            <input type="password" name="password" class="form-control bg-dark text-white border-secondary text-center" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">دخول</button>
    </form>
</div>
</body>
</html>
