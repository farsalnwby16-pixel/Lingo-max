<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شهادة إتمام الكورس - LINGOMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111; color: #fff; font-family: 'Times New Roman', serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .certificate { border: 15px solid #d4af37; padding: 50px; text-align: center; background: #fff; color: #000; width: 800px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        h1 { font-size: 45px; color: #1a1a1a; margin-bottom: 20px; }
        .name { font-size: 35px; color: #2563eb; font-weight: bold; border-bottom: 2px solid #2563eb; display: inline-block; padding-bottom: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="certificate">
        <h1>LINGOMAX ACADEMY</h1>
        <p class="fs-5">شهادة تقدير وتفوق تُمنح إلى:</p>
        <div class="name">{{ student_name }}</div>
        <p class="fs-5 mt-3">لاحترافه وإتمامه بنجاح كافة دورات ودروس المنصة التعليمية لعام 2026.</p>
        <div class="mt-5 d-flex justify-content-between px-5">
            <div>التوقيع: إدارة المنصة</div>
            <div>التاريخ: 2026</div>
        </div>
    </div>
</body>
</html>
