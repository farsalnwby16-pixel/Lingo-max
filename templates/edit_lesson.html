<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الدرس</title><script src="https://cdn.tailwindcss.com"></script>
<style>
    .lessons-container, .playlist-container, .lessons-list, .scrollable-lessons {
        scroll-behavior: smooth;
    }
    .lessons-container::-webkit-scrollbar, .playlist-container::-webkit-scrollbar, .lessons-list::-webkit-scrollbar, .scrollable-lessons::-webkit-scrollbar {
        width: 6px;
    }
    .lessons-container::-webkit-scrollbar-thumb, .playlist-container::-webkit-scrollbar-thumb, .lessons-list::-webkit-scrollbar-thumb, .scrollable-lessons::-webkit-scrollbar-thumb {
        background: #f59e0b;
        border-radius: 4px;
    }
</style>


<link rel="manifest" href="/static/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
  }
</script>

</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex items-center justify-center">
    <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
        <h1 class="text-xl font-extrabold mb-4 text-yellow-400">تعديل بيانات الدرس</h1>
        <form method="POST" class="space-y-4">
            <div><label class="block mb-1 text-sm">عنوان الدرس</label><input type="text" name="title" value="{{ lesson.title }}" required class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600"></div>
            <div><label class="block mb-1 text-sm">رابط يوتيوب</label><input type="text" name="youtube_url" value="{{ lesson.youtube_url }}" required class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600"></div>
            <div>
                <label class="block mb-1 text-sm">المستوى</label>
                <select name="level" class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600">
                    <option value="A1" {% if lesson.level == 'A1' %}selected{% endif %}>A1</option>
                    <option value="A2" {% if lesson.level == 'A2' %}selected{% endif %}>A2</option>
                    <option value="B1" {% if lesson.level == 'B1' %}selected{% endif %}>B1</option>
                    <option value="B2" {% if lesson.level == 'B2' %}selected{% endif %}>B2</option>
                    <option value="C1" {% if lesson.level == 'C1' %}selected{% endif %}>C1</option>
                </select>
            </div>
            <div><label class="block mb-1 text-sm">رقم الترتيب</label><input type="number" name="level_order" value="{{ lesson.level_order }}" class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600"></div>
            <div class="flex items-center pt-2">
                <label class="flex items-center space-x-3 space-x-reverse cursor-pointer">
                    <input type="checkbox" name="is_podcast" value="1" {% if lesson.is_podcast %}checked{% endif %} class="w-5 h-5 rounded text-yellow-500">
                    <span class="text-sm font-bold">تسجيل كبودكاست</span>
                </label>
            </div>
            <div class="flex space-x-3 space-x-reverse pt-2">
                <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold px-5 py-2.5 rounded-xl">حفظ</button>
                <a href="/admin" class="bg-gray-600 hover:bg-gray-500 px-5 py-2.5 rounded-xl text-center">إلغاء</a>
            </div>
        </form>
    </div>
</body>
</html>
