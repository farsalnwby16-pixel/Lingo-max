<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINGOMAX - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
        }
        .auth-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px;
            transition: all 0.3s ease;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(90deg, #6366f1, #4f46e5);
            color: #fff;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 15px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-primary-custom {
            background: linear-gradient(90deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .form-label {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
    </style>

<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</head>
<body>

<div class="auth-card">
    <div class="brand-title"><i class="fa-solid fa-graduation-cap me-2"></i>LINGOMAX</div>
    <div class="brand-subtitle">منصتك الاحترافية لتعلم اللغة الإنجليزية</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show text-center py-2 fs-6" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if tab != 'register' %}active{% endif %}" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab"><i class="fa-solid fa-right-to-bracket me-2"></i>تسجيل الدخول</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if tab == 'register' %}active{% endif %}" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab"><i class="fa-solid fa-user-plus me-2"></i>حساب جديد</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <!-- تبويب تسجيل الدخول -->
        <div class="tab-pane fade {% if tab != 'register' %}show active{% endif %}" id="pills-login" role="tabpanel">
            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="mb-3">
                    <label class="form-label">الاسم كامل أو البريد الإلكتروني</label>
                    <input type="text" name="login_input" class="form-control" placeholder="أدخل اسمك أو بريدك" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>دخول المنصة</button>
            </form>
        </div>

        <!-- تبويب إنشاء حساب -->
        <div class="tab-pane fade {% if tab == 'register' %}show active{% endif %}" id="pills-register" role="tabpanel">
            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="action" value="register">
                <div class="mb-3">
                    <label class="form-label">الاسم كامل <span class="text-danger">*</span></label>
                    <input type="text" name="fullname" class="form-control" placeholder="مثال: أحمد محمد" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني <span class="text-muted">(اختياري)</span></label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">كلمة المرور <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100"><i class="fa-solid fa-user-check me-2"></i>إنشاء الحساب والدخول</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
