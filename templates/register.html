<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - LINGOMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-control { background-color: #0f172a !important; color: #fff !important; border-color: #475569 !important; padding: 12px; border-radius: 8px; font-size: 14px; }
        .form-control::placeholder { color: #94a3b8 !important; opacity: 1; }
        .btn-success { background-color: #10b981; border: none; padding: 12px; font-weight: bold; border-radius: 8px; }
        .btn-success:hover { background-color: #059669; }
    </style>

<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

</head>
<body>
    <div class="card text-center">
        <div class="mb-3">
            <i class="fa-solid fa-graduation-cap text-warning fa-3x"></i>
            <h3 class="text-white mt-2 fw-bold">LINGOMAX</h3>
            <p class="text-muted small">انشاء حساب طالب جديد</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger py-2 mb-3 small" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small text-secondary">الاسم الكامل (اسم المستخدم)</label>
                <input type="text" name="username" class="form-control" placeholder="ادخل اسم المستخدم هنا" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small text-secondary">كلمة السر</label>
                <input type="password" name="password" class="form-control" placeholder="ادخل كلمة السر هنا" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">إنشاء الحساب</button>
        </form>
        <div class="mt-2">
            <a href="{{ url_for('login') }}" class="text-warning text-decoration-none small">لديك حساب بالفعل؟ تسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
