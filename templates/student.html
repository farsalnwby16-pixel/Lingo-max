<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINGOMMAX - منصة الطالب</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background-color: #0b111e; color: #fff; margin: 0; padding: 0; }
        
        /* Navbar */
        .navbar { background: #111827; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 100; }
        .brand-title { font-size: 20px; font-weight: 800; color: #f59e0b; letter-spacing: 1px; }
        .sidebar-btn { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }

        /* Sidebar Drawer */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 998; }
        .sidebar-overlay.active { display: block; }
        
        .sidebar { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #0f172a; border-left: 1px solid #1e293b; transition: 0.3s ease; padding: 16px; overflow-y: auto; z-index: 999; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar.active { right: 0; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 12px; }
        .sidebar-header h3 { margin: 0; color: #f59e0b; font-size: 16px; }
        .close-btn { background: transparent; color: #94a3b8; border: none; font-size: 20px; cursor: pointer; }

        /* Progress Bar Card */
        .progress-card { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #334155; }
        .progress-title { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: bold; }
        .progress-bg { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { background: #f59e0b; height: 100%; width: 0%; transition: width 0.4s ease; }

        /* Accordion Tree */
        .category-item { margin-bottom: 8px; }
        .category-btn { width: 100%; background: #1e293b; color: #f59e0b; border: 1px solid #334155; padding: 10px 12px; border-radius: 6px; text-align: right; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        .level-list { display: none; padding-right: 10px; margin-top: 6px; }
        .level-list.active { display: block; }
        
        .level-btn { width: 100%; background: #0f172a; color: #38bdf8; border: 1px solid #1e293b; padding: 8px 10px; border-radius: 6px; text-align: right; margin-bottom: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .level-badge { background: #334155; color: #e2e8f0; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

        .lesson-list { display: none; padding-right: 12px; margin-top: 4px; }
        .lesson-list.active { display: block; }
        
        .lesson-link { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; color: #94a3b8; border: none; padding: 6px 8px; text-align: right; cursor: pointer; font-size: 13px; border-radius: 4px; }
        .lesson-link:hover, .lesson-link.active { background: #1e293b; color: #fff; }
        .lesson-checkbox { width: 14px; height: 14px; accent-color: #f59e0b; cursor: pointer; }

        /* Certificate Lock Section */
        .cert-section { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin-top: 20px; text-align: center; }
        .cert-lock-icon { font-size: 24px; margin-bottom: 6px; }
        .cert-btn { background: #f59e0b; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; display: none; }

        /* Main Content Player Area */
        .main-container { padding: 16px; max-width: 900px; margin: 0 auto; }
        .player-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow: hidden; padding: 16px; }
        .lesson-title-display { font-size: 18px; color: #f59e0b; margin-top: 0; margin-bottom: 12px; }
        
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Certificate Modal for Printing */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .cert-paper { background: #fff; color: #111; padding: 30px; border-radius: 8px; width: 100%; max-width: 600px; text-align: center; border: 8px double #f59e0b; }
        .cert-paper h1 { color: #d97706; margin-bottom: 4px; }
        .cert-input { width: 80%; padding: 8px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold; }

        @media print {
            body * { visibility: hidden; }
            .cert-paper, .cert-paper * { visibility: visible; }
            .cert-paper { position: absolute; left: 0; top: 0; width: 100%; border: 4px solid #000; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand-title">LINGOMMAX</div>
        <button class="sidebar-btn" onclick="toggleSidebar()">☰ أقسام ومستويات الكورس</button>
    </div>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <h3>📖 أقسام ومستويات الكورس</h3>
                <button class="close-btn" onclick="toggleSidebar()">✕</button>
            </div>

            <div class="progress-card">
                <div class="progress-title">
                    <span>نسبة إنجاز الكورس</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div id="tree-container"></div>
        </div>

        <div class="cert-section" id="cert-section">
            <div class="cert-lock-icon" id="cert-icon">🔒</div>
            <div id="cert-status-text" style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">الشهادة مغلقة (أكمل الكورس 100%)</div>
            <button class="cert-btn" id="cert-btn" onclick="openCertModal()">📜 استخراج الشهادة</button>
        </div>
    </div>

    <div class="main-container">
        <div class="player-card">
            <h2 class="lesson-title-display" id="current-lesson-title">اختر درساً من القائمة الجانبية للبدء</h2>
            <div class="video-wrapper">
                <iframe id="video-frame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Certificate Modal -->
    <div class="modal" id="cert-modal">
        <div class="cert-paper">
            <h1>شهادة إتمام كورس</h1>
            <p style="font-size: 14px; color: #555;">منصة LINGOMMAX التعليمية</p>
            <p>تشهد المنصة بأن الطالب:</p>
            <input type="text" id="student-name-input" class="cert-input" placeholder="اكتب اسمك الثلاثي هنا">
            <p>قد أتم بنجاح كافة المستويات والأقسام المقررة في الكورس بنسبة 100%.</p>
            <div class="no-print" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="window.print()" style="background: #22c55e; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">طباعة PDF</button>
                <button onclick="closeCertModal()" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const categoriesList = {{ categories | tojson }};
        const levelsList = {{ levels | tojson }};
        const rawLessons = [
            {% for lesson in lessons %}
            {
                id: {{ lesson['id'] }},
                title: "{{ lesson['title'] }}",
                category: "{{ lesson['category'] }}",
                level: "{{ lesson['level'] }}",
                youtube_url: "{{ lesson['youtube_url'] }}"
            },
            {% endfor %}
        ];

        let watchedLessons = JSON.parse(localStorage.getItem('lingomax_watched') || '[]');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function renderTree() {
            const treeContainer = document.getElementById('tree-container');
            treeContainer.innerHTML = '';

            categoriesList.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-item';

                const catBtn = document.createElement('button');
                catBtn.className = 'category-btn';
                catBtn.innerHTML = `<span>📁 ${cat}</span> <span>▼</span>`;
                catBtn.onclick = () => {
                    const lList = catDiv.querySelector('.level-list');
                    lList.classList.toggle('active');
                };

                const levelList = document.createElement('div');
                levelList.className = 'level-list';

                levelsList.forEach(lvl => {
                    const lessonsArr = rawLessons.filter(l => l.category === cat && l.level === lvl);
                    
                    const lvlBtn = document.createElement('button');
                    lvlBtn.className = 'level-btn';
                    lvlBtn.innerHTML = `<span>مستوى ${lvl}</span> <span class="level-badge">${lessonsArr.length}</span>`;
                    
                    const lessonList = document.createElement('div');
                    lessonList.className = 'lesson-list';

                    lvlBtn.onclick = () => {
                        lessonList.classList.toggle('active');
                    };

                    if (lessonsArr.length === 0) {
                        const emptyText = document.createElement('div');
                        emptyText.style.padding = '6px';
                        emptyText.style.fontSize = '12px';
                        emptyText.style.color = '#64748b';
                        emptyText.innerText = 'لا توجد دروس حالياً';
                        lessonList.appendChild(emptyText);
                    } else {
                        lessonsArr.forEach(l => {
                            const lBtn = document.createElement('div');
                            lBtn.className = 'lesson-link';
                            
                            const isChecked = watchedLessons.includes(l.id);
                            lBtn.innerHTML = `
                                <input type="checkbox" class="lesson-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleWatch(${l.id})">
                                <span style="flex-grow:1;" onclick="playLesson('${l.title}', '${l.youtube_url}')">${l.title}</span>
                            `;
                            lessonList.appendChild(lBtn);
                        });
                    }

                    levelList.appendChild(lvlBtn);
                    levelList.appendChild(lessonList);
                });

                catDiv.appendChild(catBtn);
                catDiv.appendChild(levelList);
                treeContainer.appendChild(catDiv);
            });

            updateProgress();
        }

        function playLesson(title, url) {
            document.getElementById('current-lesson-title').innerText = title;
            let embedUrl = url;
            if (url.includes('watch?v=')) {
                embedUrl = url.replace('watch?v=', 'embed/');
            } else if (url.includes('youtu.be/')) {
                embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
            }
            document.getElementById('video-frame').src = embedUrl;
            toggleSidebar();
        }

        function toggleWatch(id) {
            if (watchedLessons.includes(id)) {
                watchedLessons = watchedLessons.filter(item => item !== id);
            } else {
                watchedLessons.push(id);
            }
            localStorage.setItem('lingomax_watched', JSON.stringify(watchedLessons));
            updateProgress();
        }

        function updateProgress() {
            const total = rawLessons.length;
            const watched = watchedLessons.length;
            const percent = total > 0 ? Math.round((watched / total) * 100) : 0;

            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;

            const certIcon = document.getElementById('cert-icon');
            const certText = document.getElementById('cert-status-text');
            const certBtn = document.getElementById('cert-btn');

            if (percent === 100 && total > 0) {
                certIcon.innerText = '🔓';
                certText.innerText = 'مبروك! تم فتح الشهادة بنجاح';
                certText.style.color = '#22c55e';
                certBtn.style.display = 'block';
            } else {
                certIcon.innerText = '🔒';
                certText.innerText = `الشهادة مغلقة (أكمل الكورس 100%)`;
                certText.style.color = '#94a3b8';
                certBtn.style.display = 'none';
            }
        }

        function openCertModal() {
            document.getElementById('cert-modal').classList.add('active');
        }

        function closeCertModal() {
            document.getElementById('cert-modal').classList.remove('active');
        }

        renderTree();
        if (rawLessons.length > 0) {
            playLesson(rawLessons[0].title, rawLessons[0].youtube_url);
        }
    </script>
</body>
</html>
